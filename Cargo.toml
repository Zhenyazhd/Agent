[package]
name = "llm-agent"
version = "0.1.0"
edition = "2021"
description = "LLM Agent backend with OpenRouter integration"

[lib]
name = "llm_agent"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
envy = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
futures = "0.3"
tokio-stream = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
regex = "1"
shell-words = "1"

[dev-dependencies]
tempfile = "3"
